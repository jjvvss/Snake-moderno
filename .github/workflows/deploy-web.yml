name: Deploy Web to GitHub Pages

on:
  push:
    branches: [claude/neon-snake-game-4edly]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build web
        run: npx expo export -p web

      - name: Fix asset paths for GitHub Pages
        run: |
          sed -i 's|href="/|href="/Snake-moderno/|g' dist/index.html
          sed -i 's|src="/_expo|src="/Snake-moderno/_expo|g' dist/index.html
          touch dist/.nojekyll

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages
